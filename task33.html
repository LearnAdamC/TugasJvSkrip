<!DOCTYPE html>

    <body>
        <script type="text/javascript">
            var arr = [1, 2, 3, 4, 5, 6, 7, 9, 10]

            arr.forEach(function(num) {
                if (num % 2 == 0) {
                    console.log(num + ' is Even')
                } else {
                    console.log(num + ' is Odd');
                }
            })
        </script> 
    </body>
</html>
