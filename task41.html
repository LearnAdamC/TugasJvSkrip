<!DOCTYPE html>
<html>
    <head>
        <title>Dark Mode</title>

        <style>
            .dark-theme {
                background-color: black;
                color: white;
            }
        </style>
    </head>

    <body>

        <button onclick="toggleMode()">Toggle Dark Mode</button>

        <script type="text/javascript">
            function toggleMode() {
                document.body.classList.toggle("dark-theme");
            }
        </script>

    </body>
</html>
